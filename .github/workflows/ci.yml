# PR 检查：测试 → 类型检查 → 构建（含 dist/ 密钥扫描）
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      # 扫描所有 git 跟踪的文件里有没有 JWT；CI 没有 .env，所以不查真实值
      - run: npm run check:secrets

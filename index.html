<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5ead2" />
    <meta name="description" content="一段关于卡牌、旅程与选择的轻冒险。" />
    <title>下一张牌 · 晨光小城</title>
    <style>
      #app[inert] { visibility: hidden; pointer-events: none; }
      #startup-shell { position: fixed; z-index: 2147483647; inset: 0; display: grid; place-items: center; box-sizing: border-box; padding: 24px; overflow: auto; background: linear-gradient(145deg, #edf5e8, #e7f3f5 58%, #fff3d9); color: #294b3a; font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
      #startup-shell * { box-sizing: border-box; }
      #startup-shell .startup-card { width: min(100%, 430px); padding: 28px; border: 1px solid #d3dfc9; border-radius: 20px; background: #fffdf4; box-shadow: 0 14px 40px rgba(69, 91, 68, .13); }
      #startup-shell .startup-mark { display: grid; place-items: center; width: 48px; height: 48px; margin-bottom: 18px; border: 2px solid #e5c986; border-radius: 50%; background: #fff4d4; color: #8a662c; font-size: 21px; font-weight: 700; }
      #startup-shell h1 { margin: 0; color: #315e42; font-size: 24px; line-height: 1.3; }
      #startup-shell p { margin: 12px 0 0; color: #536a59; font-size: 15px; line-height: 1.65; }
      #startup-shell #startup-stage { color: #60745f; font-size: 13px; }
      #startup-shell button { min-height: 44px; margin-top: 18px; padding: 9px 18px; border: 1px solid #8b642c; border-radius: 10px; background: #edc77e; color: #493719; font: 700 15px system-ui, -apple-system, "Microsoft YaHei", sans-serif; cursor: pointer; }
      #startup-shell button:focus-visible { outline: 3px solid #315e42; outline-offset: 3px; }
      #startup-shell [hidden] { display: none !important; }
      @media (max-width: 420px) { #startup-shell .startup-card { padding: 23px; } }
    </style>
    <script>
      (function () {
        var phase = "entry";
        var state = "loading";
        var styleFailed = false;
        var waitingForStyles = false;
        var labels = { entry: "页面入口", ui: "界面加载", style: "页面样式", "legacy-data": "旧版初始数据", render: "首屏显示" };
        var timer;

        function paint() {
          var shell = document.getElementById("startup-shell");
          if (!shell || state === "ready") return;
          shell.setAttribute("data-state", state);
          shell.setAttribute("data-stage", phase);
          document.getElementById("startup-stage").textContent = "阶段：" + labels[phase];
          document.getElementById("startup-title").textContent = state === "error" ? "暂时没能开启旅程" : "正在准备旅程";
          document.getElementById("startup-message").textContent = state === "error"
            ? "页面没有加载完成，可检查网络后重新加载。当前页面地址和本机记录会保留。"
            : state === "slow" ? "加载比预期久，页面仍在等待。可以继续等待，也可以重新加载。" : "正在准备页面，请稍等片刻。";
        }
        function fail(nextPhase) {
          if (nextPhase === "style") styleFailed = true;
          if (state === "ready" || state === "error") return;
          if (labels[nextPhase]) phase = nextPhase;
          state = "error";
          paint();
        }
        function resourceError(event) {
          if (state === "ready") return;
          var target = event.target;
          if (target && target.tagName === "LINK" && String(target.rel).toLowerCase() === "stylesheet") { fail("style"); return; }
          if (target && target.tagName === "SCRIPT" && target.type === "module") { fail("entry"); return; }
          if (target === window) fail(phase);
        }
        function finish() {
          if (state === "ready" || styleFailed) return;
          var links = document.querySelectorAll('link[rel="stylesheet"]');
          var pending = [];
          for (var i = 0; i < links.length; i++) if (!links[i].sheet) pending.push(links[i]);
          if (pending.length) {
            if (!waitingForStyles) {
              waitingForStyles = true;
              for (var j = 0; j < pending.length; j++) pending[j].addEventListener("load", function () { waitingForStyles = false; finish(); }, { once: true });
            }
            return;
          }
          state = "ready";
          window.clearTimeout(timer);
          window.removeEventListener("error", resourceError, true);
          window.removeEventListener("offline", slow);
          var app = document.getElementById("app");
          if (app) app.removeAttribute("inert");
          var shell = document.getElementById("startup-shell");
          if (shell) shell.remove();
        }
        function slow() { if (state === "loading") { state = "slow"; paint(); } }
        window.addEventListener("error", resourceError, true);
        window.addEventListener("offline", slow);
        window.__nextCardStartup = {
          begin: function (nextPhase) { if ((state === "loading" || state === "slow") && labels[nextPhase]) { phase = nextPhase; paint(); } },
          fail: fail,
          ready: finish,
          refresh: paint
        };
        window.addEventListener("DOMContentLoaded", function () {
          paint();
          if (navigator.onLine === false) slow();
        });
        timer = window.setTimeout(slow, 8000);
      }());
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <div id="app" inert></div>
    <section id="startup-shell" data-state="loading" data-stage="entry" aria-label="页面加载">
      <div class="startup-card">
        <div class="startup-mark" aria-hidden="true">灯</div>
        <div id="startup-dynamic" role="status" aria-live="polite">
          <h1 id="startup-title">正在准备旅程</h1>
          <p id="startup-message">正在准备页面，请稍等片刻。</p>
          <p id="startup-stage">阶段：页面入口</p>
        </div>
        <button id="startup-retry" type="button" onclick="window.location.reload()">重新加载</button>
        <noscript>
          <style>#startup-dynamic, #startup-retry { display: none !important; }</style>
          <h1>请先启用 JavaScript</h1>
          <p>这段旅程需要浏览器启用 JavaScript。启用后请重新加载当前页面。</p>
        </noscript>
        <p>也可以使用浏览器的重新加载功能。</p>
      </div>
    </section>
    <script>if (window.__nextCardStartup) window.__nextCardStartup.refresh();</script>
    <script type="module" src="/src/main.ts"></script>
    <script nomodule>if (window.__nextCardStartup) window.__nextCardStartup.fail("entry");</script>
  </body>
</html>
